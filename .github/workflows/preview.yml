name: Preview

on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the build number (commit count) is correct
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Output is discarded so deployment URLs never land in (public) logs.
      - run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" > /dev/null
      - run: npx --yes vercel@latest build --token="$VERCEL_TOKEN" > /dev/null
      - name: Deploy preview and update its branch and rolling aliases
        run: |
          scrub() { sed -E 's#https?://[^ ]+#<url>#g'; }
          url=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" 2>err.txt) || { echo "deploy failed:"; scrub < err.txt; exit 1; }
          echo "::add-mask::$url"
          echo "deploy ok, setting aliases"
          # The CLI alias command needs user access this token lacks, so use the REST API.
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          host=${url#https://}
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r .id)
          # Branch alias asr-<branch>-<team>.vercel.app, derived from the deployment host
          # (asr-<id>-<team>.vercel.app) so the team slug is not hard-coded. DNS labels cap at 63.
          rest=${host#asr-}
          team=${rest#*-}
          team=${team%.vercel.app}
          max=$((63 - 4 - 1 - ${#team}))
          slug=$(echo "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-$max | sed -E 's/-+$//')
          failed=0
          for alias in "asr-$slug-$team.vercel.app" asr-whp.vercel.app; do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"alias\":\"$alias\"}" "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID")
            echo "alias HTTP $code: $(jq -r '.error.code // "ok"' resp.json)"
            [ "$code" -lt 300 ] || failed=1
          done
          exit $failed
