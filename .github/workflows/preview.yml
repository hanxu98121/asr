name: Preview

on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the build number (commit count) is correct
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Output is discarded so deployment URLs never land in (public) logs.
      - run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" > /dev/null
      - run: npx --yes vercel@latest build --token="$VERCEL_TOKEN" > /dev/null
      - name: Deploy preview and point the preview domain at it
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" 2>/dev/null)
          npx --yes vercel@latest alias set "$url" asr-whp.vercel.app --token="$VERCEL_TOKEN" > /dev/null 2>&1
